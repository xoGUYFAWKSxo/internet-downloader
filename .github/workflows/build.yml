name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: node --test extension/build.test.mjs extension/detect.test.mjs extension/describe.test.mjs extension/background.test.mjs
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: build ui
        working-directory: ui
        run: wails build -clean
      - name: test ui
        working-directory: ui
        run: |
          go vet ./...
          go test -count=1 ./...
